name: HealthCheck CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Tests
        run: python -m unittest discover -s tests -v

  monitor:
    name: Check Websites
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run HealthCheck
        run: python healthcheck.py

      - name: Save Reports
        uses: actions/upload-artifact@v4
        with:
          name: healthcheck-report
          path: |
            monitoring_history.csv
            dashboard.html